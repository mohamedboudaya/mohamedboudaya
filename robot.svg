<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160" role="img" aria-label="A small robot pops up and waves hello">
  <style>
    .rb  { animation: pop 8s ease-in-out infinite; }
    .arm { animation: wave 8s ease-in-out infinite; transform-box: view-box; transform-origin: 101px 110px; }
    .bub { animation: talk 8s ease-in-out infinite; transform-box: view-box; transform-origin: 108px 52px; opacity: 0; }
    .eye { animation: blink 8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .ant { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pop {
      0%, 6%    { transform: translateY(140px); }
      15%, 70%  { transform: translateY(0); }
      80%, 100% { transform: translateY(140px); }
    }
    @keyframes wave {
      0%, 17%  { transform: rotate(0deg); }
      23%      { transform: rotate(-140deg); }
      27%      { transform: rotate(-168deg); }
      31%      { transform: rotate(-122deg); }
      35%      { transform: rotate(-168deg); }
      39%      { transform: rotate(-122deg); }
      43%      { transform: rotate(-168deg); }
      47%      { transform: rotate(-140deg); }
      55%, 100%{ transform: rotate(0deg); }
    }
    @keyframes talk {
      0%, 19%   { opacity: 0; transform: scale(0.5); }
      24%, 56%  { opacity: 1; transform: scale(1); }
      61%, 100% { opacity: 0; transform: scale(0.5); }
    }
    @keyframes blink {
      0%, 59%, 62%, 100% { transform: scaleY(1); }
      60.5%              { transform: scaleY(0.1); }
    }
    @keyframes pulse {
      0%, 100% { fill: #2F81F7; }
      50%      { fill: #79C0FF; }
    }
  </style>

  <!-- speech bubble -->
  <g class="bub">
    <path d="M114 12 h52 a10 10 0 0 1 10 10 v18 a10 10 0 0 1 -10 10 h-46 l-12 10 l3 -10 a10 10 0 0 1 -7 -10 v-18 a10 10 0 0 1 10 -10 z"
          fill="#FFFFFF" stroke="#2F81F7" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="139" y="37" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="16" font-weight="700" fill="#0D1117">Hello!</text>
  </g>

  <!-- robot -->
  <g class="rb">
    <!-- antenna -->
    <line x1="70" y1="58" x2="70" y2="46" stroke="#2F81F7" stroke-width="3" stroke-linecap="round"/>
    <circle class="ant" cx="70" cy="42" r="5" fill="#2F81F7"/>
    <!-- ears -->
    <rect x="33" y="72" width="8" height="16" rx="3" fill="#2F81F7"/>
    <rect x="99" y="72" width="8" height="16" rx="3" fill="#2F81F7"/>
    <!-- head -->
    <rect x="40" y="58" width="60" height="44" rx="12" fill="#E6EDF3" stroke="#2F81F7" stroke-width="3"/>
    <rect x="48" y="66" width="44" height="28" rx="8" fill="#0D1117"/>
    <circle class="eye" cx="60" cy="79" r="5" fill="#58A6FF"/>
    <circle class="eye" cx="80" cy="79" r="5" fill="#58A6FF"/>
    <path d="M62 87 Q70 92 78 87" fill="none" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- neck + body -->
    <rect x="63" y="101" width="14" height="6" fill="#8B949E"/>
    <rect x="46" y="105" width="48" height="42" rx="10" fill="#E6EDF3" stroke="#2F81F7" stroke-width="3"/>
    <circle cx="70" cy="122" r="6" fill="#2F81F7"/>
    <rect x="58" y="133" width="24" height="4" rx="2" fill="#8B949E"/>
    <!-- left arm -->
    <rect x="34" y="108" width="10" height="28" rx="5" fill="#E6EDF3" stroke="#2F81F7" stroke-width="2.5"/>
    <!-- right arm (waves) -->
    <g class="arm">
      <rect x="96" y="108" width="10" height="28" rx="5" fill="#E6EDF3" stroke="#2F81F7" stroke-width="2.5"/>
      <circle cx="101" cy="139" r="4.5" fill="#2F81F7"/>
    </g>
  </g>
</svg>

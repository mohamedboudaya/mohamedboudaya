<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160" role="img" aria-label="A shy robot peeks in from the corner and waves hello">
  <style>
    /* 9 s loop: hidden -> peeks in (tilted) -> blushes, shy wave, says hello -> quickly hides */
    .rb   { animation: peek 9s ease-in-out infinite; transform-box: view-box; transform-origin: 175px 160px; }
    .arm  { animation: wave 9s ease-in-out infinite; transform-box: view-box; transform-origin: 94px 110px; }
    .head { animation: tilt 9s ease-in-out infinite; transform-box: view-box; transform-origin: 125px 104px; }
    .bub  { animation: talk 9s ease-in-out infinite; transform-box: view-box; transform-origin: 90px 64px; opacity: 0; }
    .blush{ animation: blush 9s ease-in-out infinite; opacity: 0; }
    .pup  { animation: look 9s ease-in-out infinite; }
    .eye  { animation: blink 9s linear infinite; transform-box: fill-box; transform-origin: center; }
    .ant  { animation: pulse 1.8s ease-in-out infinite; }

    @keyframes peek {
      0%, 8%    { transform: translate(85px, 70px) rotate(-22deg); }
      20%       { transform: translate(14px, 6px)  rotate(-18deg); }
      24%, 62%  { transform: translate(20px, 10px) rotate(-16deg); }
      66%       { transform: translate(24px, 12px) rotate(-14deg); }
      73%, 100% { transform: translate(85px, 70px) rotate(-22deg); }
    }
    @keyframes tilt {
      0%, 22%   { transform: rotate(0deg); }
      28%       { transform: rotate(-8deg); }
      40%       { transform: rotate(-4deg); }
      50%, 58%  { transform: rotate(-9deg); }
      64%, 100% { transform: rotate(0deg); }
    }
    @keyframes wave {   /* small, timid wave: arm raised up-left */
      0%, 27%   { transform: rotate(0deg); }
      32%       { transform: rotate(140deg); }
      36%       { transform: rotate(118deg); }
      40%       { transform: rotate(142deg); }
      44%       { transform: rotate(118deg); }
      48%       { transform: rotate(140deg); }
      55%, 100% { transform: rotate(0deg); }
    }
    @keyframes talk {
      0%, 30%   { opacity: 0; transform: scale(0.4); }
      35%, 58%  { opacity: 1; transform: scale(1); }
      62%, 100% { opacity: 0; transform: scale(0.4); }
    }
    @keyframes blush {
      0%, 24%   { opacity: 0; }
      30%, 60%  { opacity: 0.85; }
      66%, 100% { opacity: 0; }
    }
    @keyframes look {   /* glances away, then at you, then away again */
      0%, 22%   { transform: translate(3px, 1px); }
      30%, 52%  { transform: translate(-2px, 0); }
      58%, 100% { transform: translate(3px, 2px); }
    }
    @keyframes blink {
      0%, 43%, 46%, 100% { transform: scaleY(1); }
      44.5%              { transform: scaleY(0.1); }
    }
    @keyframes pulse {
      0%, 100% { fill: #2F81F7; }
      50%      { fill: #79C0FF; }
    }
  </style>

  <!-- speech bubble (left of the robot) -->
  <g class="bub">
    <path d="M34 20 h42 a10 10 0 0 1 10 10 v16 a10 10 0 0 1 -6 9.2 l10 9.8 l-15 -9 h-41 a10 10 0 0 1 -10 -10 v-16 a10 10 0 0 1 10 -10 z"
          fill="#FFFFFF" stroke="#2F81F7" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="55" y="43" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="15" font-weight="700" fill="#0D1117">Hello!</text>
  </g>

  <!-- robot -->
  <g class="rb">
    <!-- body -->
    <rect x="118" y="101" width="14" height="6" fill="#8B949E"/>
    <rect x="101" y="105" width="48" height="44" rx="10" fill="#E6EDF3" stroke="#2F81F7" stroke-width="3"/>
    <circle cx="125" cy="122" r="6" fill="#2F81F7"/>
    <rect x="113" y="133" width="24" height="4" rx="2" fill="#8B949E"/>
    <!-- right arm (static, partly hidden) -->
    <rect x="151" y="108" width="10" height="28" rx="5" fill="#E6EDF3" stroke="#2F81F7" stroke-width="2.5"/>
    <!-- left arm (shy wave) -->
    <g class="arm">
      <rect x="89" y="108" width="10" height="28" rx="5" fill="#E6EDF3" stroke="#2F81F7" stroke-width="2.5"/>
      <circle cx="94" cy="139" r="4.5" fill="#2F81F7"/>
    </g>
    <!-- head -->
    <g class="head">
      <line x1="125" y1="58" x2="125" y2="46" stroke="#2F81F7" stroke-width="3" stroke-linecap="round"/>
      <circle class="ant" cx="125" cy="42" r="5" fill="#2F81F7"/>
      <rect x="88" y="72" width="8" height="16" rx="3" fill="#2F81F7"/>
      <rect x="154" y="72" width="8" height="16" rx="3" fill="#2F81F7"/>
      <rect x="95" y="58" width="60" height="44" rx="12" fill="#E6EDF3" stroke="#2F81F7" stroke-width="3"/>
      <rect x="103" y="66" width="44" height="28" rx="8" fill="#0D1117"/>
      <g class="pup">
        <circle class="eye" cx="115" cy="79" r="5" fill="#58A6FF"/>
        <circle class="eye" cx="135" cy="79" r="5" fill="#58A6FF"/>
      </g>
      <ellipse class="blush" cx="108" cy="88" rx="4" ry="2.4" fill="#FF7B9C"/>
      <ellipse class="blush" cx="142" cy="88" rx="4" ry="2.4" fill="#FF7B9C"/>
      <path d="M119 88 Q125 91 131 88" fill="none" stroke="#58A6FF" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
